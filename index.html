<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Shield Verify - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-brand">

            <div class="brand-logo">
                🛡️
            </div>

            <h1>AI Shield Verify</h1>

            <p class="brand-subtitle">
                Smarter Verification. Safer Tomorrow.
            </p>

            <div class="feature-list">

                <div class="feature-item">
                    <span>✓</span>
                    <p>Detect Fake Documents</p>
                </div>

                <div class="feature-item">
                    <span>✓</span>
                    <p>Verify Identities with AI</p>
                </div>

                <div class="feature-item">
                    <span>✓</span>
                    <p>Secure & Reliable</p>
                </div>

                <div class="feature-item">
                    <span>✓</span>
                    <p>Built for a Safer World</p>
                </div>

            </div>

            <div class="shield-illustration">
                🛡️
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-section">

            <div class="login-card">

                <div class="login-header">

                    <h2>Welcome Back</h2>

                    <p>
                        Sign in to your account
                    </p>

                </div>


                <form id="loginForm">

                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">✉</span>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-box">

                            <span class="input-icon">🔒</span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->
                    <div class="login-options">

                        <label class="remember-option">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            <span>Remember me</span>

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Login
                        <span>→</span>
                    </button>


                    <!-- MESSAGE -->
                    <p id="message"></p>

                </form>


                <!-- REGISTER -->
                <div class="register">

                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Create Account
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
